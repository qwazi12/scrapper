name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'   # a change to this workflow tests itself
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Job-level env: a step's own `env` is not visible to that step's `if`,
    # which silently skipped every deploy while the run still showed success.
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_API_TOKEN || secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_iwJkBp7HPLUnvJQoEl7gJadj' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_MvlUvP2cS5vtNBay3V2ISsSCgnJE' }}
    steps:
      - name: Require Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing GitHub secret: VERCEL_API_TOKEN or VERCEL_TOKEN — frontend NOT deployed"
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel Production
        working-directory: frontend
        run: |
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
